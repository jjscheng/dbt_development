name: 'tpch_duckdb'
version: '1.0.0'
config-version: 2

flags:
  send_anonymous_usage_stats: false

# This setting configures which "profile" dbt uses for this project.
profile: 'tpch_duckdb'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  tpch_duckdb:
    staging:
      +materialized: view
