version: 2

sources:
  - name: tpch
    database: snowflake_sample_data
    schema: tpch_sf1
    description: "TPC-H benchmark dataset from Snowflake sample data (scale factor 1)"
    tables:
      - name: orders
        description: "Customer orders header records"
      - name: lineitem
        description: "Individual line items within each order"
      - name: customer
        description: "Customer master data"
      - name: supplier
        description: "Supplier master data"
      - name: part
        description: "Parts/products catalog"
      - name: partsupp
        description: "Part-supplier availability and pricing"
      - name: nation
        description: "Nation reference data"
      - name: region
        description: "Region reference data"
